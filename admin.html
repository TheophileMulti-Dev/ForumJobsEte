<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gestion des Stands</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: #1a1a1a;
      color: white;
      padding: 20px 30px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h1 {
      font-size: 1.8rem;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #4A90E2;
      color: white;
    }

    .btn-primary:hover {
      background: #357ABD;
      transform: translateY(-2px);
    }

    .btn-success {
      background: #7ED321;
      color: white;
    }

    .btn-success:hover {
      background: #6BC116;
      transform: translateY(-2px);
    }

    .btn-danger {
      background: #E74C3C;
      color: white;
    }

    .btn-danger:hover {
      background: #C0392B;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #95a5a6;
      color: white;
    }

    .btn-secondary:hover {
      background: #7f8c8d;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: bold;
      color: #1a1a1a;
    }

    .search-filter {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-filter input,
    .search-filter select {
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      flex: 1;
      min-width: 200px;
    }

    .search-filter input:focus,
    .search-filter select:focus {
      outline: none;
      border-color: #4A90E2;
    }

    .stands-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .stand-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: all 0.2s;
    }

    .stand-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }

    .stand-card-header {
      background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stand-card-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .stand-card-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4A90E2;
    }

    .stand-card-actions {
      padding: 15px 20px;
      background: #f8f9fa;
      display: flex;
      gap: 10px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    .modal-header {
      padding: 20px 30px;
      border-bottom: 2px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.5rem;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: #f0f0f0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #ddd;
    }

    .modal-body {
      padding: 30px;
    }

    .modal-footer {
      padding: 20px 30px;
      border-top: 2px solid #f0f0f0;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: #4A90E2;
      color: white;
    }

    .export-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    .export-section h2 {
      margin-bottom: 15px;
    }

    .json-output {
      background: #1a1a1a;
      color: #7ED321;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre;
      margin-top: 15px;
    }

    .alert {
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.active {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }

    .alert-danger {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }

    @media (max-width: 768px) {
      .stands-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎯 Admin - Gestion des Stands</h1>
    <div class="header-actions">
      <button class="btn btn-success" onclick="openAddModal()">➕ Nouveau Stand</button>
      <button class="btn btn-primary" onclick="importJSON()">📥 Importer JSON</button>
      <button class="btn btn-primary" onclick="exportJSON()">📤 Exporter JSON</button>
      <a href="/ForumJobsEte/" class="btn btn-secondary">👁️ Voir le Plan</a>
    </div>
  </header>

  <div id="alert" class="alert"></div>

  <div class="stats">
    <div class="stat-card">
      <h3>Total Stands</h3>
      <div class="value" id="stat-total">0</div>
    </div>
    <div class="stat-card">
      <h3>Zone A</h3>
      <div class="value" id="stat-zone-a">0</div>
    </div>
    <div class="stat-card">
      <h3>Zone B</h3>
      <div class="value" id="stat-zone-b">0</div>
    </div>
    <div class="stat-card">
      <h3>Zone C</h3>
      <div class="value" id="stat-zone-c">0</div>
    </div>
  </div>

  <div class="search-filter">
    <input type="text" id="search" placeholder="🔍 Rechercher un stand..." onkeyup="filterStands()">
    <select id="filter-zone" onchange="filterStands()">
      <option value="">Toutes les zones</option>
      <option value="zone-a">Zone A</option>
      <option value="zone-b">Zone B</option>
      <option value="zone-c">Zone C</option>
      <option value="zone-d">Zone D</option>
      <option value="zone-e">Zone E</option>
    </select>
    <select id="filter-sector" onchange="filterStands()">
      <option value="">Tous les secteurs</option>
    </select>
  </div>

  <div class="stands-grid" id="stands-container"></div>

  <div class="export-section">
    <h2>📋 Export JSON</h2>
    <p>Copiez ce JSON dans votre fichier <code>stands.json</code> ou dans <code>index</code></p>
    <button class="btn btn-primary" onclick="copyJSON()">📋 Copier le JSON</button>
    <button class="btn btn-success" onclick="downloadJSON()">💾 Télécharger le JSON</button>
    <div class="json-output" id="json-output"></div>
  </div>
</div>

<!-- Modal Add/Edit -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">Nouveau Stand</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <form id="stand-form">
        <input type="hidden" id="edit-index" value="">
        
        <div class="form-group">
          <label>ID du Stand *</label>
          <input type="text" id="stand-id" required placeholder="Ex: A01, B02, C03...">
        </div>

        <div class="form-group">
          <label>Nom *</label>
          <input type="text" id="stand-name" required placeholder="Ex: Mission locale">
        </div>

        <div class="form-group">
          <label>Zone *</label>
          <select id="stand-zone" required>
            <option value="">Sélectionnez une zone</option>
            <option value="zone-a">Zone A - Accueil et ressources</option>
            <option value="zone-b">Zone B - Intérim</option>
            <option value="zone-c">Zone C - Entreprises</option>
            <option value="zone-d">Zone D - Autres</option>
            <option value="zone-e">Zone E - Toilettes</option>
          </select>
        </div>

        <div class="form-group">
          <label>Secteur</label>
          <input type="text" id="stand-sector" placeholder="Ex: Informations, Interim, Voiture...">
        </div>

        <div class="form-group">
          <label>Emplois proposés</label>
          <input type="text" id="stand-jobs" placeholder="Ex: Usine, chantier">
        </div>

        <div class="form-group">
          <label>Âge</label>
          <input type="text" id="stand-age" placeholder="Ex: 18+, 16+, 11-25 ans">
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="stand-description" placeholder="Description détaillée du stand..."></textarea>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-success" onclick="saveStand()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<!-- Import JSON Modal -->
<input type="file" id="file-input" accept=".json" style="display: none;" onchange="handleFileUpload(event)">

  ];
  
  filteredStands = [...standsData];
  
  // Remplir le filtre de secteur
  const sectors = [...new Set(standsData.map(s => s.sector).filter(Boolean))];
  const sectorFilter = document.getElementById('filter-sector');
  sectors.forEach(sector => {
    const option = document.createElement('option');
    option.value = sector;
    option.textContent = sector;
    sectorFilter.appendChild(option);
  });
}

// Afficher les stands
function renderStands() {
  const container = document.getElementById('stands-container');
  container.innerHTML = '';
  
  filteredStands.forEach((stand, index) => {
    const card = document.createElement('div');
    card.className = 'stand-card';
    card.innerHTML = `
      <div class="stand-card-header">
        <h3>${stand.id}</h3>
        <span class="badge">${getZoneLabel(stand.zone)}</span>
      </div>
      <div class="stand-card-body">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" value="${stand.name}" onchange="updateStand(${index}, 'name', this.value)">
        </div>
        <div class="form-group">
          <label>Secteur</label>
          <input type="text" value="${stand.sector || ''}" onchange="updateStand(${index}, 'sector', this.value)">
        </div>
        <div class="form-group">
          <label>Emplois</label>
          <input type="text" value="${stand.jobs || ''}" onchange="updateStand(${index}, 'jobs', this.value)">
        </div>
        <div class="form-group">
          <label>Âge</label>
          <input type="text" value="${stand.age || ''}" onchange="updateStand(${index}, 'age', this.value)">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea onchange="updateStand(${index}, 'description', this.value)">${stand.description || ''}</textarea>
        </div>
      </div>
      <div class="stand-card-actions">
        <button class="btn btn-primary btn-sm" onclick="editStand(${index})">✏️ Éditer</button>
        <button class="btn btn-danger btn-sm" onclick="deleteStand(${index})">🗑️ Supprimer</button>
      </div>
    `;
    container.appendChild(card);
  });
}

// Mettre à jour un champ de stand
function updateStand(index, field, value) {
  const originalIndex = standsData.findIndex(s => s.id === filteredStands[index].id);
  standsData[originalIndex][field] = value;
  filteredStands[index][field] = value;
  updateExportJSON();
  showAlert('Stand mis à jour !', 'success');
}

// Filtrer les stands
function filterStands() {
  const search = document.getElementById('search').value.toLowerCase();
  const zoneFilter = document.getElementById('filter-zone').value;
  const sectorFilter = document.getElementById('filter-sector').value;
  
  filteredStands = standsData.filter(stand => {
    const matchSearch = !search || 
      stand.name.toLowerCase().includes(search) ||
      stand.id.toLowerCase().includes(search) ||
      stand.sector.toLowerCase().includes(search);
    
    const matchZone = !zoneFilter || stand.zone === zoneFilter;
    const matchSector = !sectorFilter || stand.sector === sectorFilter;
    
    return matchSearch && matchZone && matchSector;
  });
  
  renderStands();
}

// Ouvrir modal d'ajout
function openAddModal() {
  document.getElementById('modal-title').textContent = 'Nouveau Stand';
  document.getElementById('stand-form').reset();
  document.getElementById('edit-index').value = '';
  document.getElementById('modal').classList.add('active');
}

// Éditer un stand
function editStand(index) {
  const stand = filteredStands[index];
  document.getElementById('modal-title').textContent = 'Éditer le Stand';
  document.getElementById('edit-index').value = standsData.findIndex(s => s.id === stand.id);
  document.getElementById('stand-id').value = stand.id;
  document.getElementById('stand-name').value = stand.name;
  document.getElementById('stand-zone').value = stand.zone;
  document.getElementById('stand-sector').value = stand.sector || '';
  document.getElementById('stand-jobs').value = stand.jobs || '';
  document.getElementById('stand-age').value = stand.age || '';
  document.getElementById('stand-description').value = stand.description || '';
  document.getElementById('modal').classList.add('active');
}

// Fermer modal
function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// Sauvegarder le stand
function saveStand() {
  const editIndex = document.getElementById('edit-index').value;
  const stand = {
    id: document.getElementById('stand-id').value,
    name: document.getElementById('stand-name').value,
    zone: document.getElementById('stand-zone').value,
    sector: document.getElementById('stand-sector').value,
    jobs: document.getElementById('stand-jobs').value,
    age: document.getElementById('stand-age').value,
    description: document.getElementById('stand-description').value
  };
  
  if (!stand.id || !stand.name || !stand.zone) {
    showAlert('Veuillez remplir tous les champs obligatoires !', 'danger');
    return;
  }
  
  if (editIndex !== '') {
    // Modification
    standsData[editIndex] = stand;
    showAlert('Stand modifié avec succès !', 'success');
  } else {
    // Ajout
    standsData.push(stand);
    showAlert('Stand ajouté avec succès !', 'success');
  }
  
  filteredStands = [...standsData];
  closeModal();
  renderStands();
  updateStats();
  updateExportJSON();
}

// Supprimer un stand
function deleteStand(index) {
  if (!confirm('Êtes-vous sûr de vouloir supprimer ce stand ?')) return;
  
  const stand = filteredStands[index];
  const originalIndex = standsData.findIndex(s => s.id === stand.id);
  standsData.splice(originalIndex, 1);
  filterStands();
  updateStats();
  updateExportJSON();
  showAlert('Stand supprimé !', 'success');
}

// Mettre à jour les statistiques
function updateStats() {
  document.getElementById('stat-total').textContent = standsData.length;
  document.getElementById('stat-zone-a').textContent = standsData.filter(s => s.zone === 'zone-a').length;
  document.getElementById('stat-zone-b').textContent = standsData.filter(s => s.zone === 'zone-b').length;
  document.getElementById('stat-zone-c').textContent = standsData.filter(s => s.zone === 'zone-c').length;
}

// Mettre à jour l'export JSON
function updateExportJSON() {
  document.getElementById('json-output').textContent = JSON.stringify(standsData, null, 2);
}

// Copier le JSON
function copyJSON() {
  const json = JSON.stringify(standsData, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    showAlert('JSON copié dans le presse-papier !', 'success');
  });
}

// Télécharger le JSON
function downloadJSON() {
  const json = JSON.stringify(standsData, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'stands.json';
  a.click();
  showAlert('JSON téléchargé !', 'success');
}

// Importer JSON
function importJSON() {
  document.getElementById('file-input').click();
}

// Gérer l'upload de fichier
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      standsData = data;
      filteredStands = [...standsData];
      renderStands();
      updateStats();
      updateExportJSON();
      showAlert('JSON importé avec succès !', 'success');
    } catch (error) {
      showAlert('Erreur lors de l\'import du JSON !', 'danger');
    }
  };
  reader.readAsText(file);
}

// Exporter JSON
function exportJSON() {
  updateExportJSON();
  document.querySelector('.export-section').scrollIntoView({ behavior: 'smooth' });
}

// Afficher une alerte
function showAlert(message, type) {
  const alert = document.getElementById('alert');
  alert.textContent = message;
  alert.className = `alert alert-${type} active`;
  setTimeout(() => {
    alert.classList.remove('active');
  }, 3000);
}

// Obtenir le label de zone
function getZoneLabel(zone) {
  const labels = {
    'zone-a': 'Zone A',
    'zone-b': 'Zone B',
    'zone-c': 'Zone C',
    'zone-d': 'Zone D',
    'zone-e': 'Zone E'
  };
  return labels[zone] || zone;
}

// Fermer modal en cliquant à l'extérieur
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') {
    closeModal();
  }
});
</script>

</body>
</html>
